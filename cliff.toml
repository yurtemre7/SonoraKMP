# git-cliff configuration (https://git-cliff.org/docs/configuration)
#
# Release notes (CI):   git cliff --strip header v1.2.0..v1.3.0
# Full changelog:       git cliff -o CHANGELOG.md
# Set GITHUB_TOKEN to resolve GitHub usernames and first-time contributors
# (works without it, falling back to the git author name).

[remote.github]
owner = "yurtemre7"
repo = "SonoraKMP"

[changelog]
header = """
# Changelog

All notable changes to Sonora are documented here. Generated by git-cliff from Conventional Commits.

"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**[breaking]** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% if commit.remote.username %} by @{{ commit.remote.username | replace(from="[bot]", to="") }}\
{% elif commit.author.name %} by {{ commit.author.name }}{% endif %}\
{%- endfor %}
{% endfor %}

{%- if github -%}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
### New contributors
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
- @{{ contributor.username | replace(from="[bot]", to="") }} made their first contribution\
{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
{%- endfor %}
{% endif -%}
{%- endif %}

{% if version and previous.version -%}
Full changelog: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
topo_order = false
sort_commits = "oldest"
# Drop trailing "(#123)" PR refs; the commit link already points there.
commit_preprocessors = [{ pattern = '\s*\(#([0-9]+)\)$', replace = "" }]
# HTML comments fix the group order and are stripped by `striptags` in the template.
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^release", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(build|ci)", group = "<!-- 5 -->Build & CI" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^(chore|style|revert)", group = "<!-- 7 -->Chores" },
]
