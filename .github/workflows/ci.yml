name: CI

on:
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
  workflow_dispatch:

# PRs cancel superseded runs; main never does, so the cache-saving run always finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # cache usage report in gradle-cache-save

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Seconds, no Gradle: fail fast before any runner spins up a JDK.
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check_product_name.sh
      - run: ./scripts/check_hardcoded_strings.sh

  # Lint + APK: needs the Android toolchain, runs in parallel with the tests.
  build:
    name: Lint and debug build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/gradle-setup
        id: gradle

      - name: Lint and assemble
        run: ./gradlew lintDebug assembleDebug --stacktrace

      - name: Save Gradle cache
        if: success() && github.ref == 'refs/heads/main' && steps.gradle.outputs.cache-hit != 'true'
        uses: ./.github/actions/gradle-cache-save
        with:
          key: ${{ steps.gradle.outputs.cache-key }}

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          retention-days: 3
          path: "**/build/reports/lint-results-*.*"
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sonora-debug-apk
          retention-days: 1
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Unit tests on Ubuntu only (fastest). Windows/macOS host tests were dropped to save runner time.
  test:
    name: Unit tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/gradle-setup
        id: gradle
        with:
          name: test

      - name: Unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Save Gradle cache
        if: success() && github.ref == 'refs/heads/main' && steps.gradle.outputs.cache-hit != 'true'
        uses: ./.github/actions/gradle-cache-save
        with:
          key: ${{ steps.gradle.outputs.cache-key }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ runner.os }}
          retention-days: 3
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        shell: bash
        run: |
          echo "### Unit tests on ${{ runner.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Gradle cache: \`${{ steps.gradle.outputs.cache-hit == 'true' && 'exact hit' || 'miss (cold)' }}\`" >> "$GITHUB_STEP_SUMMARY"

  # Single stable check name for branch protection, independent of the matrix.
  ci-ok:
    name: CI passed
    if: ${{ !cancelled() }}
    needs: [checks, build, test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
